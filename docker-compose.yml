services:
  web:
    build: .
    container_name: peakshift-app
    ports:
      - "5001:5001"
    volumes:
      - ./blogapp:/app/blogapp
      - ./microblog.py:/app/microblog.py
      - ./init_db.py:/app/init_db.py
      - ./instance:/app/instance
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./.env:/app/.env
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
    restart: unless-stopped
