version: '3.8'

services:
  web:
    build: .
    container_name: peakshift-app
    ports:
      - "5001:5001"
    volumes:
      # Mount the entire blogapp directory (includes all Python code)
      - ./blogapp:/app/blogapp
      # Mount startup files
      - ./microblog.py:/app/microblog.py
      - ./init_db.py:/app/init_db.py
      # Mount the database directory (data persistence)
      - ./instance:/app/instance
      # Mount logs
      - ./logs:/app/logs
      # Mount test directory
      - ./tests:/app/tests
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
